<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

  <title>Tea - Stats</title>
  <meta name="title" content="Tea - Stats">
  <meta name="description" content="Track your Chinese character learning statistics, view your character queue, search the dictionary, and monitor your writing strength.">
  <link rel="icon" href="assets/fav-32.png" sizes="32x32" type="image/ico">
  <link rel="stylesheet" href="bundle.css">
</head>

<body>
  <main id="learned-stats-page">
    <div class="stats-topbar">
      <a id="stats-button" class="mdc-icon-button mdc-icon-button--touch material-icons" href="index.html" title="Back to practice">
        <div class="mdc-icon-button__ripple"></div>
        arrow_back
        <div class="mdc-icon-button__touch"></div>
      </a>
      <h1>Stats</h1>
      <div class="auth-container">
        <button id="auth-button" class="mdc-icon-button mdc-icon-button--touch material-icons auth-sign-in-btn" title="Sign in with Google">
          <div class="mdc-icon-button__ripple"></div>
          login
          <div class="mdc-icon-button__touch"></div>
        </button>
        <img id="auth-avatar" class="auth-avatar" style="display: none;" alt="User" title="Sign out" />
      </div>
    </div>

    <section class="stats-controls-panel" role="search">
      <div id="stats-summary-metrics" class="stats-summary-metrics" aria-label="Summary metrics" role="list">
        <span class="stats-summary-metric" role="listitem">
          <span class="stats-summary-metric-label">All words</span>
          <span id="stats-metric-all" class="stats-summary-metric-value">—</span>
        </span>
        <span class="stats-summary-metric" role="listitem">
          <span class="stats-summary-metric-label">Selected words</span>
          <span id="stats-metric-selected" class="stats-summary-metric-value">—</span>
        </span>
        <span class="stats-summary-metric" role="listitem">
          <span class="stats-summary-metric-label">Learned</span>
          <span id="stats-metric-learned" class="stats-summary-metric-value">—</span>
        </span>
        <span class="stats-summary-metric" role="listitem">
          <span class="stats-summary-metric-label">Learning</span>
          <span id="stats-metric-learning" class="stats-summary-metric-value">—</span>
        </span>
      </div>
      <section class="stats-control-section" aria-labelledby="stats-state-filter-label">
        <h2 id="stats-state-filter-label" class="stats-control-label">Status</h2>
        <div id="stats-state-filters" class="mdc-evolution-chip-set mdc-chip-set mdc-chip-set--choice stats-chip-set" role="toolbar" aria-label="Status filters">
        <div class="mdc-evolution-chip-set__chips">
          <button type="button" class="mdc-chip stats-chip stats-chip--selected stats-state-filter-chip mdc-chip--selected" data-state-filter="all" aria-pressed="true">
            <span class="mdc-chip__ripple"></span>
            <span class="mdc-chip__text">All</span>
          </button>
          <button type="button" class="mdc-chip stats-chip stats-state-filter-chip" data-state-filter="learned" aria-pressed="false">
            <span class="mdc-chip__ripple"></span>
            <span class="mdc-chip__text">Learned</span>
          </button>
          <button type="button" class="mdc-chip stats-chip stats-state-filter-chip" data-state-filter="learning" aria-pressed="false">
            <span class="mdc-chip__ripple"></span>
            <span class="mdc-chip__text">Learning</span>
          </button>
          <button type="button" class="mdc-chip stats-chip stats-state-filter-chip" data-state-filter="selected" aria-pressed="false">
            <span class="mdc-chip__ripple"></span>
            <span class="mdc-chip__text">Selected</span>
          </button>
          <button type="button" class="mdc-chip stats-chip stats-state-filter-chip" data-state-filter="unlearned" aria-pressed="false">
            <span class="mdc-chip__ripple"></span>
            <span class="mdc-chip__text">Unlearned</span>
          </button>
        </div>
      </div>
      </section>
      <section class="stats-control-section" aria-labelledby="stats-scope-filter-label">
        <h2 id="stats-scope-filter-label" class="stats-control-label">In</h2>
        <div id="stats-search-scope-chips" class="mdc-evolution-chip-set mdc-chip-set mdc-chip-set--choice stats-chip-set" role="toolbar" aria-label="In shortcuts">
          <div class="mdc-evolution-chip-set__chips">
            <button type="button" class="mdc-chip stats-chip stats-chip--selected stats-scope-chip mdc-chip--selected" data-scope="all" aria-pressed="true">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">All</span>
            </button>
            <button type="button" class="mdc-chip stats-chip stats-scope-chip" data-scope="character" aria-pressed="false">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">Chinese</span>
            </button>
            <button type="button" class="mdc-chip stats-chip stats-scope-chip" data-scope="pinyin" aria-pressed="false">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">Pinyin</span>
            </button>
            <button type="button" class="mdc-chip stats-chip stats-scope-chip" data-scope="jyutping" aria-pressed="false">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">Jyutping</span>
            </button>
            <button type="button" class="mdc-chip stats-chip stats-scope-chip" data-scope="definition" aria-pressed="false">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">English</span>
            </button>
            <button type="button" class="mdc-chip stats-chip stats-scope-chip" data-scope="hsk" aria-pressed="false">
              <span class="mdc-chip__ripple"></span>
              <span class="mdc-chip__text">HSK</span>
            </button>
          </div>
        </div>
      </section>
      <section class="stats-control-section" aria-label="Search">
        <div id="stats-search-controls">
        <label id="stats-search-textfield" class="mdc-text-field mdc-text-field--outlined mdc-text-field--no-label">
          <span class="mdc-notched-outline">
            <span class="mdc-notched-outline__leading"></span>
            <span class="mdc-notched-outline__notch"></span>
            <span class="mdc-notched-outline__trailing"></span>
          </span>
          <span class="material-icons stats-search-icon" aria-hidden="true">search</span>
          <input id="stats-search-input" type="text" class="mdc-text-field__input" placeholder="Search characters, pinyin, English, HSK..." autocomplete="off" spellcheck="false">
          <button id="stats-clear-search" class="mdc-icon-button mdc-icon-button--touch" type="button" aria-label="Clear search" hidden>
            <span class="mdc-icon-button__ripple"></span>
            <span class="mdc-icon-button__icon material-icons" aria-hidden="true">close</span>
            <span class="mdc-icon-button__touch"></span>
          </button>
        </label>
        <button id="stats-reset-filters" class="mdc-icon-button mdc-icon-button--touch" type="button" title="Reset search filters" aria-label="Reset search filters">
          <span class="mdc-icon-button__ripple"></span>
          <span class="mdc-icon-button__icon material-icons" aria-hidden="true">filter_alt_off</span>
          <span class="mdc-icon-button__touch"></span>
        </button>
        <p id="stats-search-status" class="stats-search-status" aria-live="polite"></p>
      </div>
      </section>
    </section>

    <div id="stats-empty-state" hidden>
      <p id="stats-empty">No matching words.</p>
      <p id="stats-empty-suggestion" hidden></p>
    </div>
    <div id="learned-stats-grid-container" class="mdc-layout-grid">
      <div id="learned-stats-grid" class="mdc-layout-grid__inner"></div>
    </div>

    <footer class="stats-footer">
      <p id="stats-summary" class="stats-summary">Loading…</p>
      <p id="stats-page-info">Showing 0 of 0</p>
    </footer>
  </main>
</body>

</html>
